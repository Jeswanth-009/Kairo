[package]
name = "kairo"
version = "5.0.0"
description = "Kairo — local-first career intelligence workspace"
authors = ["Kairo"]
license = "MIT"
edition = "2021"
default-run = "kairo"

[lib]
name = "kairo_lib"
# rlib only: the desktop binary links this crate directly. The mobile
# crate-types (staticlib/cdylib) were never used — no gen/android or
# gen/apple targets exist — and the debug cdylib cannot link on the
# windows-gnu dev toolchain anyway (lld chokes on >65k exported symbols).
crate-type = ["rlib"]

[[bin]]
name = "render-resume"
path = "src/bin/render-resume.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
ureq = { version = "2", features = ["json"] }
rust-stemmers = "1"
sha2 = "0.11"
# Backup archives: portable zip with deflate; manifest + hashes live inside.
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Per-job export locks: an async mutex held across the (blocking) compile.
tokio = { version = "1", default-features = false, features = ["sync"] }

# Per-OS credential stores — same keyring API on every platform.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[profile.dev]
incremental = true
