[package]
name = "kairo"
version = "0.1.0"
description = "Kairo — local-first career intelligence workspace"
authors = ["Kairo"]
edition = "2021"

[lib]
name = "kairo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "render-resume"
path = "src/bin/render-resume.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["windows-native"] }

[profile.dev]
incremental = true
