[package]
name = "kairo"
version = "4.2.0"
description = "Kairo — local-first career intelligence workspace"
authors = ["Kairo"]
license = "MIT"
edition = "2021"
default-run = "kairo"

[lib]
name = "kairo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "render-resume"
path = "src/bin/render-resume.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
ureq = { version = "2", features = ["json"] }
rust-stemmers = "1"
sha2 = "0.11"
# Backup archives: portable zip with deflate; manifest + hashes live inside.
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Per-OS credential stores — same keyring API on every platform.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[profile.dev]
incremental = true
