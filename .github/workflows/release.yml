name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build installer and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # tauri-build validates bundle.externalBin when its build script runs,
      # so the sidecar must exist before the first cargo invocation.
      - name: Fetch Tectonic sidecar
        run: npm run ensure-tectonic

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # The updater plugin verifies update signatures against the pubkey in
      # tauri.conf.json, so the bundle step needs the matching private key. A
      # missing secret must never break the release: fall back to an ephemeral
      # key and skip the updater manifest so the app offers no update (its
      # check endpoint simply has no latest.json to fetch).
      - name: Restore updater signing key
        id: signkey
        shell: bash
        env:
          TAURI_SIGNING_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_SECRET" ]; then
            printf '%s' "$TAURI_SIGNING_SECRET" > "$RUNNER_TEMP/updater.key"
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            echo "key_file=$RUNNER_TEMP/updater.key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set — this release ships without a trusted updater manifest. Set the secret (see docs/RELEASING.md) before tagging a release users should auto-update to."
            npx tauri signer generate -w "$RUNNER_TEMP/updater.key" --password "" --ci
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "key_file=$RUNNER_TEMP/updater.key" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri release bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ steps.signkey.outputs.key_file }}
        run: npm run tauri build

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          # GNU sha256sum is available in the GitHub-hosted Windows runner's bash.
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes for this version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Keep-a-Changelog: body runs from "## [VERSION]" to the next "## [" heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          # Fallback so a missing section never publishes an empty release body.
          if [ ! -s release_notes.md ]; then
            echo "See CHANGELOG.md for the full history." > release_notes.md
          fi
          cat release_notes.md

      # latest.json is the manifest the in-app updater polls. Only generated
      # when the real signing key is present — an ephemeral-key manifest would
      # point users at an update their app refuses to install.
      - name: Build updater manifest
        if: steps.signkey.outputs.trusted == 'true'
        shell: bash
        run: |
          node scripts/make-updater-manifest.mjs \
            src-tauri/target/release/bundle/nsis \
            "${GITHUB_REF_NAME#v}" \
            release_notes.md
          cat src-tauri/target/release/bundle/nsis/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kairo ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/latest.json
